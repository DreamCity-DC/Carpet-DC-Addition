plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${mod_version}+${minecraft_version}"
group = maven_group
base { archivesName = archives_base_name }

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "maven.modrinth:carpet:${carpet_version}"
    // Fabric Loader 0.19.5 supplies this at runtime; do not bundle another copy.
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.5.5'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

jar {
    from('LICENSE') { rename { "${it}_${archives_base_name}" } }
    from('NOTICE.md')
}

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
}
